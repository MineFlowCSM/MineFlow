name: mineflow-ci

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_window_x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Configure build
        run: cmake -S . -B build -A x64

      - name: Build app for release
        run: cmake --build build --config Release --parallel

      - name: Zip binary
        run: |
          New-Item -ItemType Directory -Path release
          Copy-Item build/bin/Release/mineflow.exe, README.md -Destination release
          Compress-Archive -Path release/* -DestinationPath mineflow-windows-x86_64.zip

      - name: Collect artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mineflow-windows-x86_64
          path: mineflow-windows-x86_64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
      - build_window_x64

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: mineflow-windows-x86_64
          path: release

      - name: Upload artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/mineflow-windows-x86_64.zip"
          artifactErrorsFailBuild: true
